services:
  - type: web
    name: community-publisher
    env: node
    buildCommand: npm install
    startCommand: node server.js
    plan: free
    envVars:
      - key: INSIDED_REGION
        sync: false
      - key: INSIDED_AUTHOR_ID
        sync: false
      - key: INSIDED_CLIENT_ID
        sync: false
      - key: INSIDED_CLIENT_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
